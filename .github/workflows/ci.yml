name: Client checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  native:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run build
      - run: cargo +stable fmt --check
        working-directory: src-tauri
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo +stable test --locked
        working-directory: src-tauri
      - run: npm run tauri -- build --debug --no-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-client-${{ runner.os }}
          path: |
            src-tauri/target/debug/syntrachat.exe
            src-tauri/target/debug/syntrachat
  audit:
    uses: SyntraChat/.github/.github/workflows/reusable-security.yml@5f9a4ddbdfd3b854d5c1771589b80087908be762
    with:
      directory: src-tauri
